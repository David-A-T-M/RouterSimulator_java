name: Java CI with Gradle

# Se dispara en cada push o pull request a la rama principal
on:
  push:
    branches: [ "main", "master", 'feat/**'  ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Check (Linter + Formatter + Tests)
        run: ./gradlew check